name: Build and validate

on:
  pull_request:
    branches: [main, "fix/**"]
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check server JavaScript syntax
        run: node --check server/index.js && node --check server/gameRules.js
      - name: Run game rule tests
        run: npm test
      - name: Build production bundle
        run: npm run build
